zapisz_parametr:
  fields:
    pnu:
      required: true
      example: 11180
      selector:
        select:
          options:
            - "11180"
            - "11181"
            - "11400"
            - "11401"
            - "11402"
            - "11403"
            - "11404"
            - "11405"
            - "11178"
    wartosc:
      required: true
      example: 21.0
      selector:
        number:
          min: 5
          max: 150
          step: 0.5
          unit_of_measurement: "°C"
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: smartservice_ecl

